<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE 学习中心 · 17 模块学习平台</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:#f5f6f8;color:#24292f;font-size:15px;line-height:1.65}
a{color:#0969da}
#app{display:flex;min-height:100vh}

/* ---------- 侧栏 ---------- */
#sidebar{width:230px;min-width:230px;background:#1c2128;color:#c9d1d9;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;padding-bottom:24px}
.brand{padding:20px 16px 14px;border-bottom:1px solid #2d333b}
.brand .t1{font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px}
.brand .t2{font-size:12px;color:#8b949e;margin-top:4px}
.nav-group{margin-top:12px}
.nav-cap{font-size:11px;color:#6e7681;padding:8px 16px 2px;letter-spacing:1px}
.nav-item{display:flex;width:100%;text-align:left;padding:9px 16px;background:none;border:none;border-left:3px solid transparent;color:#c9d1d9;font-size:14px;cursor:pointer;font-family:inherit;align-items:center;justify-content:space-between;gap:8px}
.nav-item:hover{background:#262d36;color:#fff}
.nav-item.active{background:#2d3640;color:#fff;border-left-color:#58a6ff;font-weight:600}
.nav-pct{font-size:11px;color:#8b949e;font-family:Consolas,monospace}
.nav-item.active .nav-pct{color:#c9d1d9}
.side-foot{margin:22px 16px 0;padding-top:12px;border-top:1px solid #2d333b;font-size:11px;color:#6e7681;line-height:1.8}

/* ---------- 主区 ---------- */
#main{margin-left:230px;flex:1;padding:26px 32px 70px;min-height:100vh}
.page{max-width:960px;margin:0 auto}
h1.pg{font-size:24px;margin:0 0 6px}
h2.sec{font-size:18px;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid #e4e7eb}
.sub{color:#57606a;font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e4e7eb;border-radius:8px;padding:18px 22px;margin-bottom:18px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:16px}
.grid .card{flex:1 1 270px;margin-bottom:0}
.modcard{cursor:pointer;transition:border-color .15s}
.modcard:hover{border-color:#0969da}
.mc-desc{font-size:13px;color:#57606a;margin:2px 0 10px;min-height:40px}
.mc-meta{font-size:12px;color:#8b949e;margin-top:6px}
.pbar{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.pbar>span{display:block;height:100%;background:#2da44e;border-radius:4px;transition:width .2s}
.pnum{font-size:12px;color:#57606a}
.hintbox{background:#fff8c5;border:1px solid #d4a72c;border-radius:6px;padding:12px 16px;font-size:13px;margin:14px 0;line-height:1.8}
.hintbox code{background:rgba(175,184,193,.25);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace}

/* ---------- 清单 ---------- */
.listcard{padding:8px 14px}
.list-note{font-size:12px;color:#8b949e;padding:8px 6px 4px}
.item-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid #f0f2f4}
.item-row:last-child{border-bottom:none}
.item-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex:none}
.item-title{flex:1;font-size:14px;min-width:0}
.item-title a{color:inherit;text-decoration:none}
.item-title a:hover{color:#0969da;text-decoration:underline}
.item-row.done .item-title a{color:#8b949e}
.item-row.done .item-title{text-decoration:line-through;color:#8b949e}
.item-path{font-size:11px;color:#b0b8c1;font-family:Consolas,monospace;flex:none}
.mini{font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid #d0d7de;background:#f6f8fa;cursor:pointer;color:#57606a;text-decoration:none;display:inline-block;font-family:inherit}
.mini:hover{background:#eef1f4;color:#24292f}
.mini.accent{border-color:#0969da;color:#0969da}
.mini.danger{border-color:#cf222e;color:#cf222e;background:#fff}
.mini.danger:hover{background:#ffebe9;color:#cf222e}
.btn{padding:7px 18px;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;cursor:pointer;font-size:14px;font-family:inherit;text-decoration:none;display:inline-block;color:#24292f}
.btn:hover{background:#eef1f4}
.btn.primary{background:#0969da;border-color:#0969da;color:#fff}
.btn.primary:hover{background:#0860ca}
.btn.danger{color:#cf222e;border-color:#cf222e;background:#fff}
.btn.danger:hover{background:#ffebe9}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- 阅读器 / markdown ---------- */
.reader-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.reader-path{font-family:Consolas,monospace;font-size:13px;color:#57606a;flex:1}
.reader-card{padding:6px 26px 26px}
.toc{border:1px solid #d0d7de;border-radius:8px;background:#fff;padding:10px 16px;margin:14px 0;font-size:13px}
.toc .toc-t{font-weight:700;margin-bottom:4px;font-size:12px;color:#57606a;letter-spacing:1px}
.toc a{display:block;color:#0969da;text-decoration:none;padding:2px 0}
.toc a:hover{text-decoration:underline}
.md h1{font-size:24px;margin:18px 0 14px;padding-bottom:8px;border-bottom:2px solid #e4e7eb}
.md h2{font-size:19px;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid #e4e7eb}
.md h3{font-size:16px;margin:22px 0 8px}
.md h4,.md h5,.md h6{font-size:15px;margin:18px 0 6px}
.md p{margin:10px 0}
.md ul,.md ol{margin:10px 0;padding-left:26px}
.md li{margin:4px 0}
.md blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid #d0d7de;background:#f6f8fa;color:#57606a;border-radius:0 6px 6px 0}
.md hr{border:none;border-top:1px solid #e4e7eb;margin:20px 0}
.md code{font-family:Consolas,"Courier New",monospace;font-size:13px;background:rgba(175,184,193,.25);padding:1px 5px;border-radius:4px}
.md img{max-width:100%}
.twrap{overflow-x:auto;margin:12px 0}
.twrap table,.cheat table{border-collapse:collapse;width:100%;font-size:13.5px}
.twrap th,.twrap td,.cheat th,.cheat td{border:1px solid #e4e7eb;padding:6px 10px;text-align:left;vertical-align:top;line-height:1.6}
.twrap th,.cheat th{background:#f6f8fa;white-space:nowrap}
.twrap code,.cheat code{font-family:Consolas,"Courier New",monospace;font-size:12.5px;background:rgba(175,184,193,.25);padding:1px 4px;border-radius:4px}
.codewrap{margin:12px 0;border:1px solid #e4e7eb;border-radius:8px;overflow:hidden;background:#f6f8fa}
.codelang{font-size:11px;color:#57606a;background:#eef1f4;padding:4px 12px;border-bottom:1px solid #e4e7eb;font-family:Consolas,monospace;letter-spacing:.5px}
.codewrap pre{margin:0;padding:12px 14px;overflow-x:auto}
.codewrap code{font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;background:none;padding:0;white-space:pre;tab-size:4}
.md-details{border:1px solid #d0d7de;border-radius:8px;margin:12px 0;background:#fff}
.md-details>summary{cursor:pointer;padding:9px 14px;font-weight:600;background:#f6f8fa;border-radius:8px}
.md-details[open]>summary{border-bottom:1px solid #e4e7eb;border-radius:8px 8px 0 0}
.md-details-body{padding:4px 16px 10px}
.taskbox{margin-right:2px}
.taskbox input{cursor:default}

/* ---------- 测验 ---------- */
.quiz-top{display:flex;align-items:center;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.quiz-meta{font-size:13px;color:#57606a}
.quiz-card{padding:22px 26px}
.quiz-q{font-size:16px;font-weight:600;line-height:1.7;margin-bottom:16px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 14px;border:1px solid #d0d7de;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;line-height:1.6;color:#24292f}
.quiz-opt:hover{border-color:#0969da;background:#f0f7ff}
.qo-key{flex:none;font-weight:700;color:#0969da;font-family:Consolas,monospace}
.score-big{font-size:34px;font-weight:700;text-align:center;margin:6px 0 10px}
.wr-row{padding:7px 12px;border-radius:6px;margin:6px 0;font-size:14px}
.wr-row.bad{background:#ffebe9;color:#cf222e;border:1px solid #ffcecb}
.wr-row.good{background:#dafbe1;color:#116329;border:1px solid #aceebb}
.wr-explain{font-size:13.5px;color:#57606a;background:#f6f8fa;border-radius:6px;padding:10px 12px;margin-top:8px;line-height:1.7}

/* ---------- 技能卡 ---------- */
.fk-top{display:flex;align-items:center;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.fk-meta{font-size:13px;color:#57606a}
.fk-stats{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:#57606a;margin:0 0 6px}
.fk-stat b{font-size:17px;font-family:Consolas,monospace;color:#24292f;margin-right:4px}
.fk-stat.due b{color:#cf222e}
.fk-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 6px;font-size:13px;color:#57606a}
.fk-filters select{padding:6px 10px;border:1px solid #d0d7de;border-radius:6px;background:#f6f8fa;font-family:inherit;font-size:13px;color:#24292f;cursor:pointer}
.fk-switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.fk-switch input{width:15px;height:15px;cursor:pointer}
.fk-scene{perspective:1400px;height:340px;margin:10px 0 6px}
.fk-card{position:relative;width:100%;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .4s}
.fk-card.flipped{transform:rotateY(180deg)}
.fk-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:20px 26px 16px;overflow-y:auto;display:flex;flex-direction:column}
.fk-backface{transform:rotateY(180deg);background:#f5fbff;border-color:#0969da}
.fk-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.fk-src{font-size:11.5px;color:#8b949e;font-family:Consolas,monospace;word-break:break-all}
.fk-badges{display:flex;gap:6px;align-items:center}
.fk-badge{font-size:11px;font-weight:700;border-radius:4px;padding:0 7px;border:1px solid #d0d7de;background:#f6f8fa;color:#57606a}
.fk-badge.selftest{color:#0969da;border-color:#a5d6ff;background:#f0f7ff}
.fk-badge.scenario{color:#116329;border-color:#aceebb;background:#dafbe1}
.fk-badge.quiz{color:#8250df;border-color:#d2cdf3;background:#f8f4fe}
.fk-badge.box{color:#57606a}
.fk-text{font-size:15.5px;line-height:1.85;white-space:pre-line;flex:1}
.fk-text code{font-family:Consolas,"Courier New",monospace;font-size:13.5px;background:rgba(175,184,193,.25);padding:1px 5px;border-radius:4px}
.fk-hint{font-size:12px;color:#b0b8c1;text-align:center;margin-top:10px}
.fk-grades{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
.fk-g{padding:8px 26px;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;cursor:pointer;font-size:14px;font-family:inherit;color:#24292f}
.fk-g:hover{background:#eef1f4}
.fk-g small{color:#8b949e;font-size:11px;margin-left:4px}
.fk-g.g-no:hover{background:#ffebe9;border-color:#ffcecb;color:#cf222e}
.fk-g.g-fuzzy:hover{background:#fff8c5;border-color:#d4a72c;color:#7d4e00}
.fk-g.g-yes:hover{background:#dafbe1;border-color:#aceebb;color:#116329}
.fk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:#8b949e}
.fk-note{font-size:12.5px;color:#8b949e;margin:2px 0 10px}

/* ---------- 计时器 ---------- */
.timer-card{text-align:center;padding:28px 22px}
.timer-disp{font-family:Consolas,"Courier New",monospace;font-size:54px;font-weight:700;letter-spacing:2px}
.timer-disp.warn{color:#9a6700}
.timer-disp.over{color:#cf222e}
.timer-btns{margin:16px 0 10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.timer-msg{display:none;margin:12px auto 0;padding:9px 16px;border-radius:6px;font-size:14px;max-width:560px}
.timer-msg.show{display:block;background:#fff8c5;color:#7d4e00;border:1px solid #d4a72c}
.timer-msg.show.danger{background:#ffebe9;color:#cf222e;border:1px solid #ffcecb;font-weight:700}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:6px}
.exam-item{display:flex;align-items:center;gap:6px;border:1px solid #e4e7eb;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;background:#fff}
.exam-item.done{background:#dafbe1;border-color:#aceebb;color:#116329}
.exam-item input{margin:0}

/* ---------- 速查 ---------- */
.cheat h3{font-size:15px;margin:20px 0 8px}
.cheat p{font-size:13.5px;color:#57606a}

/* ---------- 能力支柱视图 ---------- */
.pillar-row{padding:12px 2px;border-bottom:1px solid #f0f2f4}
.pillar-row:last-child{border-bottom:none;padding-bottom:4px}
.pr-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pr-name{font-weight:700;font-size:15px}
.pr-pct{font-size:12px;color:#57606a;font-family:Consolas,monospace}
.pr-role{font-size:12px;color:#8b949e;margin-top:2px}
.pr-one{font-size:13px;color:#57606a;margin:4px 0 8px}
.pr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pchip{font-size:12px;padding:1px 9px;border-radius:10px;border:1px solid #d0d7de;background:#f6f8fa;color:#57606a;cursor:pointer;font-family:Consolas,monospace;font-weight:600}
.pchip:hover{border-color:#0969da;color:#0969da;background:#f0f7ff}
.pchip.alt{border-style:dashed;font-family:inherit;font-weight:400}

/* ---------- 场景速查 ---------- */
.scn-src{font-size:12.5px;color:#57606a;margin:-6px 0 12px}
.scn-src code{font-family:Consolas,monospace;background:rgba(175,184,193,.25);padding:1px 5px;border-radius:4px}
.scn-ops{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:#8b949e}
.scn-cat{border:1px solid #d0d7de;border-radius:8px;background:#fff;margin-bottom:10px}
.scn-cat>summary{cursor:pointer;padding:10px 14px;font-weight:600;background:#f6f8fa;border-radius:8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.scn-cat>summary::-webkit-details-marker{display:none}
.scn-cat[open]>summary{border-bottom:1px solid #e4e7eb;border-radius:8px 8px 0 0}
.scn-cat>summary::before{content:'▸';color:#8b949e;margin-right:2px}
.scn-cat[open]>summary::before{content:'▾'}
.scn-t{font-size:14px}
.scn-sub{font-weight:400;font-size:12px;color:#8b949e}
.scn-count{font-weight:400;font-size:12px;color:#0969da;margin-left:auto}
.scn-item{padding:10px 16px;border-bottom:1px solid #f0f2f4}
.scn-item:last-child{border-bottom:none}
.scn-phe{font-size:14px;font-weight:600;line-height:1.65}
.scn-meta{font-size:13px;color:#57606a;margin-top:3px;line-height:1.7}
.scn-meta b{color:#24292f;font-weight:600}
.scn-badge{display:inline-block;font-size:11px;font-weight:700;color:#cf222e;background:#ffebe9;border:1px solid #ffcecb;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.scn-link{background:none;border:none;padding:0;color:#0969da;cursor:pointer;font:inherit;font-size:inherit;text-align:left;text-decoration:none}
.scn-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"><div class="page" id="page"></div></main>
</div>

<script src="content.js"></script>
<script src="quiz-data.js"></script>
<script src="cards-data.js"></script>
<script>
/* SRE 学习中心（learning-hub）：单文件应用，无外部依赖，file:// 双击可用。
   内容索引与题库分别来自同目录 content.js（build-content.ps1 生成）与 quiz-data.js；
   技能卡来自 cards-data.js（scripts/gen-skill-cards.mjs 生成）。
   这些脚本缺失时本页仍可工作：清单勾选、测验（有题库时）、计时器、速查不受影响。 */
(function () {
  'use strict';

  /* ================= 基础工具 ================= */
  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function safeHref(u) {
    var v = String(u || '').trim();
    if (/^(https?:|mailto:|#|\/|\.\/|\.\.\/)/i.test(v)) { return v; }
    return '#';
  }
  function tbl(head, rows) {
    var h = '<div class="twrap"><table><thead><tr>';
    for (var a = 0; a < head.length; a++) { h += '<th>' + head[a] + '</th>'; }
    h += '</tr></thead><tbody>';
    for (var b = 0; b < rows.length; b++) {
      h += '<tr>';
      for (var c = 0; c < rows[b].length; c++) { h += '<td>' + rows[b][c] + '</td>'; }
      h += '</tr>';
    }
    return h + '</tbody></table></div>';
  }
  function codeBlock(lang, code) {
    return '<div class="codewrap"><div class="codelang">' + esc(lang || 'text') + '</div><pre><code>' + esc(code) + '</code></pre></div>';
  }

  /* ================= 模块清单（硬编码，路径与仓库实际文件一一对应） =================
     章节键：m.dir + '/' + f；lab 键：m.dir + '/' + p。
     相对链接 ../<dir>/... 从 portal/ 出发指向 learning-hub 根下的源文件。 */
  var MODULES = [
    {
      id: 'linux', nav: 'Linux 底座', name: 'Linux 底座与性能', dir: '01-linux',
      desc: '启动与 systemd、文件系统与 IO、内存、CFS 调度、内核网络栈与性能分析方法论，为一切运维工作打底。',
      chapters: [
        { f: '01-boot-and-systemd.md', t: '01 · 启动流程与 systemd' },
        { f: '02-filesystem-and-io.md', t: '02 · 文件系统与 IO' },
        { f: '03-memory-deep-dive.md', t: '03 · 内存深入：虚拟内存、page cache 与 OOM' },
        { f: '04-processes-and-cfs.md', t: '04 · 进程、CFS 调度与负载均值' },
        { f: '05-network-stack-internals.md', t: '05 · 内核网络栈：收包路径、netfilter 与 TIME_WAIT' },
        { f: '06-performance-analysis.md', t: '06 · 性能分析方法论：USE、60 秒巡检与火焰图' }
      ],
      labs: [
        { p: 'labs/01-sixty-second-drill', t: 'Lab 01 · 60 秒应急排查演练：CPU / 内存 / 磁盘' },
        { p: 'labs/02-network-stack-lab', t: 'Lab 02 · TCP 协议栈实战：TIME_WAIT 洪峰与短连接生命周期' }
      ]
    },
    {
      id: 'programming', nav: '编程', name: '运维编程：Shell / Python / Go', dir: '02-programming',
      desc: 'Shell 从能跑到不炸、把命令变成工具，Python 运维工具箱，Go 进阶通向 Operator 与采集器。',
      chapters: [
        { f: '01-shell-fundamentals.md', t: '01 · Shell 基础：从"能跑"到"不炸"' },
        { f: '02-shell-ops-patterns.md', t: '02 · Shell 运维模式：把命令变成工具' },
        { f: '03-python-for-ops.md', t: '03 · Python 运维基础：为写工具而学' },
        { f: '04-python-ops-toolkit.md', t: '04 · Python 运维工具箱：四个能写进简历的工具' },
        { f: '05-go-for-sre.md', t: '05 · Go for SRE：选学进阶，通向 Operator' }
      ],
      labs: [
        { p: 'labs/01-shell-inspection', t: 'Lab 01 · 批量巡检脚本 batch-inspect.sh' },
        { p: 'labs/02-python-exporter', t: 'Lab 02 · 用 Python 写一个 Prometheus exporter' }
      ]
    },
    {

  /* ================= 迷你 Markdown 渲染器 =================
     支持：标题 / 有序无序列表（含任务列表与两层缩进）/ 表格 / 围栏代码块（标注语言，不做语法高亮）/
     粗体、斜体、行内代码 / 链接 / 引用 / 分隔线 / details 折叠块。 */
  var PH_C = 'x-placeholder-code-x';
  var PH_P = 'x-placeholder-pipe-x';
  function inlineMd(s) {
    var codes = [];
    s = String(s === null || s === undefined ? '' : s).replace(/`([^`]+)`/g, function (m, c) {
      codes.push(c);
      return PH_C + (codes.length - 1) + PH_C;

    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {

    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w\*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(new RegExp(PH_C + '([0-9]+)' + PH_C, 'g'), function (m, i) {
      return '<code>' + esc(codes[+i]) + '</code>';
    });
    return s;
  }
  function taskListItem(text) {
    var m = String(text).match(/^\[( |x|X)\]\s+(.*)$/);
    if (!m) { return inlineMd(text); }

    return '<span class="taskbox"><input type="checkbox" disabled' + checked + '></span> ' + inlineMd(m[2]);
  }
  function isSepRow(l) {
    return /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/.test(l) && l.indexOf('-') >= 0;
  }
  function isTableStart(lines, i) {
    return lines[i].indexOf('|') >= 0 && i + 1 < lines.length && isSepRow(lines[i + 1]);
  }
  function splitRow(l) {
    l = l.trim().replace(/\\\|/g, PH_P);
    if (l.charAt(0) === '|') { l = l.slice(1); }
    if (l.charAt(l.length - 1) === '|') { l = l.slice(0, -1); }
    var parts = l.split('|');
    for (var a = 0; a < parts.length; a++) { parts[a] = parts[a].split(PH_P).join('|').trim(); }

  function buildList(items, ordered) {
    var tag = ordered ? 'ol' : 'ul';
    var html = '<' + tag + '>', cur = 0, inLi = false;
    for (var a = 0; a < items.length; a++) {
      var it = items[a];
      if (it.lvl > cur) {
        html += ordered ? '<ol>' : '<ul>';
        cur = it.lvl; inLi = false;
      } else if (it.lvl < cur) {
        html += '</li>' + (ordered ? '</ol>' : '</ul>');
        cur = it.lvl; inLi = true;
      }
      if (inLi) { html += '</li>'; }
      html += '<li>' + taskListItem(it.text);

  function detailsHtml(buf) {
    var raw = buf.join('\n');

    var sum = sm ? sm[1].trim() : '展开查看';
    var inner = raw

  }
  function mdParse(src, toc) {
    var lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0, n = lines.length;
    function blank(s) { return /^\s*$/.test(s); }

    while (i < n) {
      var line = lines[i];

      var fm = line.match(/^```+\s*([\w#+.-]*)\s*$/);
      if (fm) {
        var lang = (fm[1] || '').trim();
        var buf = [];
        i++;
        while (i < n && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        if (i < n) { i++; }
        out.push(codeBlock(lang, buf.join('\n')));
        continue;
      }

      if (/^\s*<details\b/i.test(line)) {
        var dbuf = [];
        while (i < n && !/<\/details>/i.test(lines[i])) { dbuf.push(lines[i]); i++; }
        if (i < n) { dbuf.push(lines[i]); i++; }
        out.push(detailsHtml(dbuf));
        continue;
      }

      var hm = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (hm) {
        var lvl = hm[1].length, txt = hm[2];
        if (lvl === 2 && toc) {
          var hid = 'sec-' + (toc.length + 1);
          toc.push({ id: hid, title: txt });
          out.push('<h2 id="' + hid + '">' + inlineMd(txt) + '</h2>');
        } else {
          out.push('<h' + lvl + '>' + inlineMd(txt) + '</h' + lvl + '>');
        }
        i++;
        continue;
      }

      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      if (/^\s*>/.test(line)) {
        var qb = [];
        while (i < n && /^\s*>/.test(lines[i])) { qb.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + mdParse(qb.join('\n'), null) + '</blockquote>');
        continue;
      }

      if (isTableStart(lines, i)) {
        var head = splitRow(line);
        i += 2;
        var body = [];
        while (i < n && lines[i].indexOf('|') >= 0 && !blank(lines[i])) {
          body.push(splitRow(lines[i])); i++;
        }
        var th = '<div class="twrap"><table><thead><tr>';
        for (var c1 = 0; c1 < head.length; c1++) { th += '<th>' + inlineMd(head[c1]) + '</th>'; }
        th += '</tr></thead><tbody>';
        for (var r1 = 0; r1 < body.length; r1++) {
          th += '<tr>';
          for (var c2 = 0; c2 < head.length; c2++) { th += '<td>' + inlineMd(body[r1][c2] || '') + '</td>'; }
          th += '</tr>';
        }
        out.push(th + '</tbody></table></div>');
        continue;
      }

      var ulm = line.match(/^(\s*)[-*+]\s+(.*)$/);
      var olm = line.match(/^(\s*)(\d+)[.)]\s+(.*)$/);
      if (ulm || olm) {
        var ordered = !!olm;
        var items = [];
        while (i < n) {
          var mm = lines[i].match(ordered ? /^(\s*)(\d+)[.)]\s+(.*)$/ : /^(\s*)[-*+]\s+(.*)$/);
          if (mm) {
            var ind = mm[1].replace(/\t/g, '  ').length;
            items.push({ lvl: ind >= 2 ? 1 : 0, text: ordered ? mm[3] : mm[2] });
            i++;
          } else if (!blank(lines[i]) && /^\s{2,}\S/.test(lines[i]) && items.length) {
            items[items.length - 1].text += ' ' + lines[i].trim();
            i++;
          } else {
            break;
          }
        }
        out.push(buildList(items, ordered));
        continue;
      }

      if (blank(line)) { i++; continue; }

      var para = [line]; i++;
      while (i < n && !blank(lines[i]) &&
        !/^```/.test(lines[i]) &&
        !/^\s*<details\b/i.test(lines[i]) &&
        !/^#{1,6}\s/.test(lines[i]) &&
        !/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(lines[i]) &&
        !/^\s*>/.test(lines[i]) &&
        !/^\s*[-*+]\s+/.test(lines[i]) &&
        !/^\s*\d+[.)]\s+/.test(lines[i]) &&
        !isTableStart(lines, i)) {
        para.push(lines[i]); i++;
      }
      out.push('<p>' + inlineMd(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  /* ================= 自测题库 ================= */
  /* 题库展示名与推荐顺序：题库本身从 window.QUIZ_DATA 动态枚举，
     之后在 quiz-data.js 里新增题库无需再改本页；未登记展示名的题库以 id 原样显示。 */
  var QUIZ_BANK_META = {
    pca: 'PCA · Prometheus 认证',
    cka: 'CKA · Kubernetes 管理员',
    cks: 'CKS · Kubernetes 安全',
    basics: '基础 · 容器与 K8s 通用',

    programming: '编程 · Shell / Python / Go',
    cicd: 'CI/CD · Git、流水线与 GitOps',
    otel: 'OTel · OpenTelemetry',
    logging: '日志 · ELK 与 Loki',
    middleware: '中间件 · Nginx / MySQL / Redis / MongoDB',
    datastream: '数据流 · Kafka / Flink',
    sre: 'SRE · 方法论与实践',
    cloud: '云计算 · 阿里云与 AWS',
    aiops: 'AIOps · LLM 辅助运维',
    bigdata: '大数据 · HDFS / YARN / Spark / Doris / 湖仓',
    distributed: '分布式 · 理论与共识'
  };
  var QUIZ_BANK_ORDER = ['pca', 'cka', 'cks', 'basics', 'linux', 'programming', 'cicd', 'otel', 'logging', 'middleware', 'datastream', 'sre', 'cloud', 'aiops', 'bigdata', 'distributed'];
  var quizState = { bank: null, idx: 0, answers: [], finished: false };

  function bankName(id) {
    return Object.prototype.hasOwnProperty.call(QUIZ_BANK_META, id) ? QUIZ_BANK_META[id] : id;
  }
  function quizBanks() {
    var qd = window.QUIZ_DATA, out = [], seen = {};
    if (!qd || typeof qd !== 'object') { return out; }
    function pushBank(id) {
      if (seen[id]) { return; }
      seen[id] = 1;
      if (Array.isArray(qd[id]) && qd[id].length > 0) { out.push({ id: id, name: bankName(id) }); }
    }
    for (var a = 0; a < QUIZ_BANK_ORDER.length; a++) { pushBank(QUIZ_BANK_ORDER[a]); }
    for (var k in qd) { if (Object.prototype.hasOwnProperty.call(qd, k)) { pushBank(k); } }
    return out;
  }
  function optText(opts, i) {
    return (i >= 0 && opts && opts[i] !== undefined) ? String.fromCharCode(65 + i) + '. ' + esc(opts[i]) : '（未作答）';
  }
  function quizPickHtml(qd, banks) {
    var h = '<div class="grid">';
    for (var a = 0; a < banks.length; a++) {
      var b = banks[a];
      h += '<div class="card modcard" data-quiz-start="' + b.id + '">';
      h += '<h3>' + esc(b.name) + '</h3>';
      h += '<div class="mc-desc">' + qd[b.id].length + ' 道单选题，点击开始。</div>';
      h += '<div class="mc-meta">逐题作答 · 交卷判分 · 可重做</div></div>';
    }
    h += '</div>';
    h += '<div class="card"><h3>答题规则</h3><ul>';
    h += '<li>点击选项即提交本题并自动进入下一题，提交后不可回改。</li>';
    h += '<li>全部作答后显示得分、错题与解析。</li>';
    h += '<li>同一题库可反复重做，建议隔几天刷一次加深记忆。</li></ul></div>';
    return h;
  }
  function quizQuestionHtml(arr) {
    var i = quizState.idx;
    var q = arr[i] || {};
    var opts = Array.isArray(q.options) ? q.options : [];
    var h = '<div class="quiz-top">';
    h += '<button class="btn" data-quiz-back>← 换题库</button>';
    h += '<span class="quiz-meta">' + esc(bankName(quizState.bank)) + ' · 第 ' + (i + 1) + ' / ' + arr.length + ' 题</span>';
    h += '<span class="quiz-meta">已作答 ' + quizState.answers.length + ' 题</span></div>';
    h += '<div class="card quiz-card"><div class="quiz-q">' + esc(q.q || '（题干缺失）') + '</div><div class="quiz-opts">';
    for (var a = 0; a < opts.length; a++) {
      h += '<button class="quiz-opt" data-quiz-opt="' + a + '">';
      h += '<span class="qo-key">' + String.fromCharCode(65 + a) + '</span>';
      h += '<span class="qo-text">' + esc(opts[a]) + '</span></button>';
    }
    h += '</div></div>';
    h += '<div class="pbar"><span style="width:' + Math.floor(quizState.idx * 100 / arr.length) + '%"></span></div>';
    return h;
  }
  function quizResultHtml(arr) {
    var ans = quizState.answers, score = 0, wrong = [];
    for (var a = 0; a < arr.length; a++) {
      var q = arr[a] || {};
      var right = typeof q.answer === 'number' ? q.answer : -1;
      var picked = typeof ans[a] === 'number' ? ans[a] : -1;
      if (right >= 0 && picked === right) { score++; }
      else { wrong.push({ k: a, q: q, picked: picked, right: right }); }
    }
    var pct = arr.length ? Math.floor(score * 100 / arr.length) : 0;
    var h = '<div class="quiz-top">';
    h += '<button class="btn" data-quiz-back>← 换题库</button>';
    h += '<span class="quiz-meta">' + esc(bankName(quizState.bank)) + ' · 成绩单</span></div>';
    h += '<div class="card" style="text-align:center"><div class="score-big">' + score + ' / ' + arr.length + '</div>';
    h += '<div class="pbar"><span style="width:' + pct + '%"></span></div>';
    h += '<div class="pnum">正确率 ' + pct + '%</div>';
    h += '<div style="margin-top:12px"><button class="btn primary" data-quiz-redo>重做本题库</button></div></div>';
    if (!wrong.length) {
      h += '<div class="card"><h3>全对。换下一个题库继续。</h3></div>';
    } else {
      h += '<h2 class="sec">错题回顾（' + wrong.length + '）</h2>';
      for (var b = 0; b < wrong.length; b++) {
        var w = wrong[b];
        var opts = Array.isArray(w.q.options) ? w.q.options : [];
        h += '<div class="card"><div class="quiz-q">' + (w.k + 1) + '. ' + esc(w.q.q || '') + '</div>';
        h += '<div class="wr-row bad">你的答案：' + optText(opts, w.picked) + '</div>';
        h += '<div class="wr-row good">正确答案：' + optText(opts, w.right) + '</div>';
        h += '<div class="wr-explain"><b>解析</b>：' + esc(w.q.explain || '（无解析）') + '</div></div>';
      }
    }
    return h;
  }
  function renderQuiz() {
    var qd = window.QUIZ_DATA;
    var h = '<h1 class="pg">自测题库</h1><div class="sub">逐题作答，交卷即判分并给出错题解析。</div>';
    if (!qd || typeof qd !== 'object') {
      h += '<div class="hintbox">未检测到题库数据（window.QUIZ_DATA 为空）。请确认 portal 目录下存在 quiz-data.js，且与本页同目录加载。</div>';
      document.getElementById('page').innerHTML = h;
      return;
    }
    var banks = quizBanks();
    if (!banks.length) {
      h += '<div class="hintbox">quiz-data.js 已加载，但 window.QUIZ_DATA 里没有非空数组形式的题库。</div>';
      document.getElementById('page').innerHTML = h;
      return;
    }
    if (quizState.bank) {
      var arr = qd[quizState.bank];
      if (!Array.isArray(arr) || !arr.length) { quizState.bank = null; }
    }
    if (!quizState.bank) {
      h += quizPickHtml(qd, banks);
    } else if (quizState.finished) {
      h += quizResultHtml(qd[quizState.bank]);
    } else {
      h += quizQuestionHtml(qd[quizState.bank]);
    }
    document.getElementById('page').innerHTML = h;
  }

  /* ================= 技能卡 =================
     数据来自同目录 cards-data.js（window.HUB_CARDS，scripts/gen-skill-cards.mjs 生成，
     源头为各章自测问答 + SCENARIOS.md + quiz-data.js）。
     记忆曲线用 Leitner 简版：自评 会=box+1（封顶 3）、模糊=box 不变、不会=box 重置 1；
     box 决定复习到期间隔：box1=10 分钟、box2=1 天、box3=7 天。
     进度存 localStorage 键 hub-cards：{ 卡id: {box:1|2|3, due:时间戳} }。 */
  var CKEY = 'hub-cards';
  var BOX_MS = { 1: 10 * 60 * 1000, 2: 24 * 60 * 60 * 1000, 3: 7 * 24 * 60 * 60 * 1000 };
  var CARD_TYPE_NAME = { selftest: '自测', scenario: '场景', quiz: '题库' };
  var cardsState = { group: 'all', shuffle: false, deck: null, idx: 0, flipped: false };

  function loadCardMem() {
    try {
      var v = JSON.parse(localStorage.getItem(CKEY) || '{}');
      return (v && typeof v === 'object') ? v : {};
    } catch (e) { return {}; }
  }
  function saveCardMem(m) {
    try { localStorage.setItem(CKEY, JSON.stringify(m)); } catch (e) {}
  }
  function hubCards() {
    var c = window.HUB_CARDS;
    return (c && Array.isArray(c.cards) && c.cards.length) ? c.cards : null;
  }
  function pillarIndexOf(modDir) {
    var m = modByDir(modDir);
    if (!m) { return -1; }
    for (var a = 0; a < PILLARS.length; a++) {
      for (var b = 0; b < PILLARS[a].ids.length; b++) {
        if (PILLARS[a].ids[b] === m.id) { return a; }
      }
    }
    return -1;
  }
  function cardsStats(cards, mem) {
    var now = Date.now(), learned = 0, mastered = 0, due = 0;
    for (var a = 0; a < cards.length; a++) {
      var r = mem[cards[a].id];
      if (!r) { continue; }
      learned++;
      if (r.box === 3) { mastered++; }
      if (r.due && r.due <= now) { due++; }
    }
    return { total: cards.length, learned: learned, mastered: mastered, due: due };
  }
  function cardsFiltered(group) {
    var cards = hubCards();
    if (!cards) { return []; }
    var mem = null, out = [];
    if (group === 'due') { mem = loadCardMem(); }
    var now = Date.now();
    for (var a = 0; a < cards.length; a++) {
      var c = cards[a];
      if (group === 'all') { out.push(c); }
      else if (group === 'due') {
        var r = mem[c.id];
        if (r && r.due && r.due <= now) { out.push(c); }
      }
      else if (group.indexOf('mod:') === 0) { if (c.module === group.slice(4)) { out.push(c); } }
      else if (group.indexOf('type:') === 0) { if (c.type === group.slice(5)) { out.push(c); } }
      else if (group.indexOf('pillar:') === 0) {
        if (pillarIndexOf(c.module) === parseInt(group.slice(7), 10)) { out.push(c); }
      }
    }
    if (cardsState.shuffle) {
      for (var b = out.length - 1; b > 0; b--) {
        var j = Math.floor(Math.random() * (b + 1));
        var t = out[b]; out[b] = out[j]; out[j] = t;
      }
    }
    return out;
  }
  function rebuildDeck() {
    cardsState.deck = cardsFiltered(cardsState.group);
    cardsState.idx = 0;
    cardsState.flipped = false;
  }
  function gradeCard(id, grade) {
    var m = loadCardMem();
    var r = m[id] || { box: 1, due: 0 };
    var box = r.box || 1;
    if (grade === 'yes') { box = Math.min(3, box + 1); }
    else if (grade === 'no') { box = 1; }
    r.box = box;
    r.due = Date.now() + BOX_MS[box];
    r.ts = Date.now();
    m[id] = r;
    saveCardMem(m);
  }

  }

  /* ================= 考试计时器 ================= */
  var BASE_TITLE = document.title;
  var timerState = { totalSec: 120 * 60, leftSec: 120 * 60, running: false, iv: null, warned: false };
  var EKEY = 'hub-exam-sim';
  var EXAM_QUESTIONS = 17;

  function pad2(x) { return x < 10 ? '0' + x : '' + x; }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    return pad2(Math.floor(sec / 3600)) + ':' + pad2(Math.floor((sec % 3600) / 60)) + ':' + pad2(sec % 60);
  }
  function loadExamSim() {
    var v = [];
    try {
      var raw = JSON.parse(localStorage.getItem(EKEY) || '[]');
      if (Array.isArray(raw)) { v = raw; }
    } catch (e) { v = []; }
    while (v.length < EXAM_QUESTIONS) { v.push(0); }
    v.length = EXAM_QUESTIONS;
    return v;
  }
  function saveExamSim(arr) {
    try { localStorage.setItem(EKEY, JSON.stringify(arr)); } catch (e) {}
  }
  function updateExamCount() {
    var el = document.getElementById('examDone');
    if (!el) { return; }
    var sim = loadExamSim(), c = 0;
    for (var a = 0; a < sim.length; a++) { if (sim[a]) { c++; } }
    el.textContent = String(c);
  }
  function updateTimerDisplay() {
    var d = document.getElementById('timerDisp');
    if (!d) { return; }
    d.textContent = fmtTime(timerState.leftSec);
    d.className = 'timer-disp' +
      (timerState.leftSec === 0 ? ' over' : (timerState.leftSec <= 300 ? ' warn' : ''));
  }
  function updateTimerButtons() {
    var b = document.getElementById('timerToggle');
    if (!b) { return; }
    b.textContent = timerState.running ? '暂停' : (timerState.leftSec < timerState.totalSec ? '继续' : '开始');
    b.setAttribute('data-timer', timerState.running ? 'pause' : 'start');
    b.disabled = !timerState.running && timerState.leftSec <= 0;
  }
  function showTimerMsg(text, danger) {
    var el = document.getElementById('timerMsg');
    if (!el) { return; }
    el.textContent = text;
    el.className = 'timer-msg show' + (danger ? ' danger' : '');
  }
  function hideTimerMsg() {
    var el = document.getElementById('timerMsg');
    if (el) { el.className = 'timer-msg'; }
  }
  function startTimer() {
    if (timerState.leftSec <= 0) { return; }
    timerState.running = true;
    if (!timerState.iv) { timerState.iv = setInterval(timerTick, 1000); }
    updateTimerButtons();
  }
  function pauseTimer() {
    timerState.running = false;
    if (timerState.iv) { clearInterval(timerState.iv); timerState.iv = null; }
    updateTimerButtons();
  }
  function resetTimer(sec) {
    pauseTimer();
    timerState.totalSec = sec || timerState.totalSec;
    timerState.leftSec = timerState.totalSec;
    timerState.warned = false;
    hideTimerMsg();
    document.title = BASE_TITLE;
    updateTimerDisplay();
    updateTimerButtons();
  }
  function timerTick() {
    if (!timerState.running) { return; }
    timerState.leftSec--;
    if (timerState.leftSec <= 0) {
      timerState.leftSec = 0;
      pauseTimer();
      updateTimerDisplay();
      showTimerMsg('时间到！考试结束，请停止作答并检查提交。', true);
      document.title = '[时间到] ' + BASE_TITLE;
      try { window.alert('时间到！120 分钟模拟考试结束。'); } catch (e) {}
      return;
    }
    if (timerState.leftSec <= 15 * 60 && !timerState.warned) {
      timerState.warned = true;
      showTimerMsg('剩余 15 分钟：抓紧收尾，先保证已做题目的终态验证。', false);
    }
    updateTimerDisplay();
  }

    document.getElementById('page').innerHTML = h;
    updateTimerDisplay();
    updateTimerButtons();
  }

  function scnRefHtml(ref) {
    var parts = String(ref || '').split('；'), out = [];
    for (var a = 0; a < parts.length; a++) {
      var s = parts[a].trim();
      if (!s) { continue; }
      var m = s.match(/^([\w./-]+\.md)([#（(].*)?$/);
      if (m) {
        var path = m[1];
        if (path.indexOf('scripts/') === 0) {
          out.push('<a href="../' + path + '" target="_blank" rel="noopener">' + esc(s) + '</a>');
        } else {
          out.push('<button class="scn-link" data-nav="#/read/' + path + '">' + esc(s) + '</button>');
        }
      } else {
        out.push(esc(s));
      }
    }
    return out.join('；');
  }
  function scnCatBody(cat) {
    var h = '';
    for (var a = 0; a < cat.items.length; a++) {
      var it = cat.items[a];
      h += '<div class="scn-item">';
      h += '<div class="scn-phe">' + (it[3] ? '<span class="scn-badge">靶场</span>' : '') + inlineMd(it[0]) + '</div>';
      h += '<div class="scn-meta"><b>先查</b>：' + inlineMd(it[1]) + '</div>';
      h += '<div class="scn-meta"><b>详见</b>：' + scnRefHtml(it[2]) + '</div>';
      h += '</div>';
    }
    return h;
  }
  function scnFill(dl) {
    var body = dl ? dl.querySelector('.scn-body') : null;
    if (body && !body.innerHTML) {
      var idx = parseInt(body.getAttribute('data-cat'), 10);
      if (SCN_CATS[idx]) { body.innerHTML = scnCatBody(SCN_CATS[idx]); }
    }
  }
  function renderScenarios() {
    var total = 0, drills = 0;
    for (var a = 0; a < SCN_CATS.length; a++) {
      for (var b = 0; b < SCN_CATS[a].items.length; b++) {
        total++;
        if (SCN_CATS[a].items[b][3]) { drills++; }
      }
    }
    var h = '<h1 class="pg">场景速查</h1>';
    h += '<div class="sub">按故障现象组织的排障索引：出事时从「现象」进门，先执行「先查」的命令再决定下一步，「详见」直达对应章节。共 ' + total + ' 条 · 其中 ' + drills + ' 条标 <span class="scn-badge">靶场</span>（对应 scripts/faults 故障注入脚本，可配合做限时演练）。与 ROADMAP（按学习顺序）互补：ROADMAP 回答「接下来学什么」，本页回答「现在挂了去哪查」。</div>';
    h += '<div class="scn-src">数据来源：learning-hub 根目录 <code>SCENARIOS.md</code> · <a href="../SCENARIOS.md" target="_blank" rel="noopener">原文</a> · <button class="mini" data-nav="#/read/SCENARIOS.md">阅读器打开</button></div>';
    h += '<div class="scn-ops"><button class="mini" data-scn="expand">展开全部</button><button class="mini" data-scn="collapse">收起全部</button><span>分类默认收起，点开才渲染条目，121 条也不拖慢页面</span></div>';
    for (var c = 0; c < SCN_CATS.length; c++) {
      var cat = SCN_CATS[c];
      var dn = 0;
      for (var d = 0; d < cat.items.length; d++) { if (cat.items[d][3]) { dn++; } }
      h += '<details class="scn-cat"' + (c === 0 ? ' open' : '') + '><summary>';
      h += '<span class="scn-t">' + esc(cat.t) + '</span><span class="scn-sub">' + esc(cat.sub) + '</span>';
      h += '<span class="scn-count">' + cat.items.length + ' 条' + (dn ? ' · 靶场 ' + dn : '') + '</span></summary>';
      h += '<div class="scn-body" data-cat="' + c + '"></div></details>';
    }
    document.getElementById('page').innerHTML = h;
    var dls = document.querySelectorAll('.scn-cat');
    for (var e = 0; e < dls.length; e++) {
      (function (dl) {
        dl.addEventListener('toggle', function () { if (dl.open) { scnFill(dl); } });
        if (dl.open) { scnFill(dl); }
      })(dls[e]);
    }
  }

  /* ================= 事件与初始化 ================= */
  function closestAttr(t, name) {
    while (t && t !== document) {
      if (t.getAttribute && t.getAttribute(name) !== null) { return t; }
      t = t.parentNode;
    }
    return null;
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.parentNode) { return; }

    var nav = closestAttr(t, 'data-nav');
    if (nav) {
      var href = nav.getAttribute('data-nav');
      if (href && href.indexOf('#/') === 0) {
        location.hash = href;
        ev.preventDefault();
      }
      return;
    }

    var rst = closestAttr(t, 'data-reset');
    if (rst) {
      var rm = modById(rst.getAttribute('data-reset'));
      if (rm && window.confirm('确定清空「' + rm.nav + '」模块的全部勾选记录？')) {
        var p = loadProg();
        var ids = modItems(rm);
        for (var a = 0; a < ids.length; a++) { delete p[ids[a]]; }
        saveProg(p);
        route();
      }
      return;
    }

    var qs = closestAttr(t, 'data-quiz-start');
    if (qs) {
      quizState.bank = qs.getAttribute('data-quiz-start');
      quizState.idx = 0; quizState.answers = []; quizState.finished = false;
      renderQuiz();
      return;
    }

    var qo = closestAttr(t, 'data-quiz-opt');
    if (qo) {
      var qd0 = window.QUIZ_DATA;
      var arr = (qd0 && typeof qd0 === 'object') ? qd0[quizState.bank] : null;
      if (Array.isArray(arr) && quizState.idx < arr.length) {
        quizState.answers[quizState.idx] = parseInt(qo.getAttribute('data-quiz-opt'), 10);
        quizState.idx++;
        if (quizState.idx >= arr.length) { quizState.finished = true; }
      }
      renderQuiz();
      return;
    }

    var qr = closestAttr(t, 'data-quiz-redo');
    if (qr) {
      quizState.idx = 0; quizState.answers = []; quizState.finished = false;
      renderQuiz();
      return;
    }

    var qb = closestAttr(t, 'data-quiz-back');
    if (qb) {
      quizState.bank = null; quizState.idx = 0; quizState.answers = []; quizState.finished = false;
      renderQuiz();
      return;
    }

    var cfx = closestAttr(t, 'data-cards-flip');
    if (cfx) {
      cardsState.flipped = !cardsState.flipped;
      if (cfx.classList) { cfx.classList.toggle('flipped', cardsState.flipped); }
      return;
    }

    var cgr = closestAttr(t, 'data-cards-grade');
    if (cgr) {
      if (cardsState.deck && cardsState.idx < cardsState.deck.length) {
        gradeCard(cardsState.deck[cardsState.idx].id, cgr.getAttribute('data-cards-grade'));
        cardsState.idx++;
        cardsState.flipped = false;
        renderCards();
      }
      return;
    }

    var cpv = closestAttr(t, 'data-cards-prev');
    if (cpv) {
      if (cardsState.idx > 0) { cardsState.idx--; }
      cardsState.flipped = false;
      renderCards();
      return;
    }

    var csk = closestAttr(t, 'data-cards-skip');
    if (csk) {
      cardsState.idx++;
      cardsState.flipped = false;
      renderCards();
      return;
    }

    var crt = closestAttr(t, 'data-cards-restart');
    if (crt) {
      cardsState.idx = 0;
      cardsState.flipped = false;
      renderCards();
      return;
    }

    var cbr = closestAttr(t, 'data-cards-rebuild');
    if (cbr) {
      rebuildDeck();
      renderCards();
      return;
    }

    var ccl = closestAttr(t, 'data-cards-clear');
    if (ccl) {
      if (window.confirm('确定清空技能卡的全部记忆记录（box 与到期时间）？')) {
        try { localStorage.removeItem(CKEY); } catch (e) {}
        rebuildDeck();
        renderCards();
      }
      return;
    }

    var tt = closestAttr(t, 'data-timer');
    if (tt) {
      var act = tt.getAttribute('data-timer');
      if (act === 'start') { startTimer(); }
      else if (act === 'pause') { pauseTimer(); }
      else if (act === 'reset') { resetTimer(); }
      else if (act === 'preset') { resetTimer(parseInt(tt.getAttribute('data-min'), 10) * 60); }
      return;
    }

    var se = closestAttr(t, 'data-scn');
    if (se) {
      var act2 = se.getAttribute('data-scn');
      var cats = document.querySelectorAll('.scn-cat');
      for (var s2 = 0; s2 < cats.length; s2++) {
        if (act2 === 'expand') { cats[s2].open = true; scnFill(cats[s2]); }
        else { cats[s2].open = false; }
      }
      return;
    }

    var ec = closestAttr(t, 'data-exam-clear');
    if (ec) {
      if (window.confirm('确定清空 17 题的勾选记录？')) {
        saveExamSim([]);
        renderTimer();
      }
    }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) { return; }

    if (t.getAttribute('data-prog') !== null) {
      var id = t.getAttribute('data-prog');
      var p = loadProg();
      if (t.checked) { p[id] = 1; } else { delete p[id]; }
      saveProg(p);
      var row = t.parentNode;
      while (row && row !== document && (!row.className || String(row.className).indexOf('item-row') < 0)) { row = row.parentNode; }
      if (row && row.classList) { row.classList.toggle('done', t.checked); }
      refreshBars();
      return;
    }

    if (t.getAttribute('data-examq') !== null) {
      var qi = parseInt(t.getAttribute('data-examq'), 10);
      var sim = loadExamSim();
      sim[qi] = t.checked ? 1 : 0;
      saveExamSim(sim);
      updateExamCount();
      var lab = t.parentNode;
      if (lab && lab.classList) { lab.classList.toggle('done', t.checked); }
      return;
    }

    if (t.getAttribute('data-cards-group') !== null) {
      cardsState.group = t.value || 'all';
      rebuildDeck();
      renderCards();
      return;
    }

    if (t.getAttribute('data-cards-shuffle') !== null) {
      cardsState.shuffle = t.checked;
      rebuildDeck();
      renderCards();
    }
  });

  /* 技能卡键盘操作：空格翻卡，1/2/3 自评，←/→ 翻页（仅 #/cards 页生效） */
  document.addEventListener('keydown', function (ev) {
    if ((location.hash || '').indexOf('#/cards') !== 0) { return; }
    var tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') { return; }
    var deck = cardsState.deck;
    if (!deck || !deck.length || cardsState.idx >= deck.length) { return; }
    var cur = deck[cardsState.idx];
    if (ev.key === ' ' || ev.key === 'Spacebar') {
      ev.preventDefault();
      var el = document.querySelector('.fk-card');
      cardsState.flipped = !cardsState.flipped;
      if (el && el.classList) { el.classList.toggle('flipped', cardsState.flipped); }
    } else if (ev.key === '1' || ev.key === '2' || ev.key === '3') {
      gradeCard(cur.id, ev.key === '3' ? 'yes' : (ev.key === '2' ? 'fuzzy' : 'no'));
      cardsState.idx++;
      cardsState.flipped = false;
      renderCards();
    } else if (ev.key === 'ArrowLeft') {
      if (cardsState.idx > 0) { cardsState.idx--; }
      cardsState.flipped = false;
      renderCards();
    } else if (ev.key === 'ArrowRight') {
      cardsState.idx++;
      cardsState.flipped = false;
      renderCards();
    }
  });

  window.addEventListener('hashchange', route);

  buildSidebar();
  if (!location.hash) { location.hash = '#/overview'; }
  route();
  refreshBars();
})();
</script>
