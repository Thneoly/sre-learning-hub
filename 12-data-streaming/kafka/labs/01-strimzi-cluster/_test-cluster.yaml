apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka
  namespace: kafka-lab
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 640Mi
      cpu: "1"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka-lab
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    jvmOptions:
      "-Xmx": "192m"
      "-Xms": "96m"
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 640Mi
        cpu: "1"
  entityOperator:
    topicOperator:
      jvmOptions:
        "-Xmx": "96m"
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 384Mi
          cpu: 500m
    userOperator:
      jvmOptions:
        "-Xmx": "96m"
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 384Mi
          cpu: 500m
  cruiseControl:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
        cpu: "1"
    jvmOptions:
      "-Xmx": "256m"
  kafkaExporter: {}
